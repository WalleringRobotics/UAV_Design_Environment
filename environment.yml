name: uav-design
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - jupyter
  - jupyterlab
  - numpy
  - scipy
  - pandas
  - matplotlib
  - seaborn
  - pyyaml
  - pip
  - pytest
  - nbclient
  - ipykernel
  - pip:
    - -e .
    - openmdao>=3.28
    - plotly
    - ipywidgets
    - git+https://github.com/sobester/ADRpy
