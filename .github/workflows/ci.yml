name: CI

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MPLBACKEND: Agg

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install model, notebook review and printer MCP dependencies
        run: pip install -c requirements-lock.txt -e ".[test,printer,review]"
      - name: Notebooks are in sync with scripts/nbdefs
        run: |
          python scripts/build_notebooks.py
          git diff --exit-code -- platforms
      - name: Fast model tests
        env:
          MPLBACKEND: Agg
        run: pytest -q -m "not cad" --ignore=tests/test_notebooks.py

  cad:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CAD, notebook review and test dependencies
        run: pip install -c requirements-lock.txt -e ".[cad,test,review]"
      - name: Build printable parts and verify printer fit
        env:
          MPLBACKEND: Agg
        run: python scripts/build_parts.py --no-converge --review-out outputs/review
      - name: CAD regression tests
        env:
          MPLBACKEND: Agg
        run: pytest -q -m cad
      - name: Export and validate print-bed review project
        run: |
          python -m uavdesign.printing plan
          pytest -q tests/test_print_planner.py tests/test_printer_adapters.py
      - name: Notebook execution tests (after manifest generation)
        env:
          MPLBACKEND: Agg
        run: pytest -q tests/test_notebooks.py
      - name: Export independent design review with executed notebooks and CAD drawings
        run: python scripts/build_design_review.py --out outputs/design_review
      - name: Upload fabrication deliverables
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: survey-wing-fabrication
          path: |
            outputs/review/
            outputs/review.zip
            outputs/print_projects/
          if-no-files-found: error
          retention-days: 14
      - name: Upload independent design review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: survey-wing-design-review
          path: |
            outputs/design_review/
            outputs/design_review.zip
          if-no-files-found: error
          retention-days: 30
