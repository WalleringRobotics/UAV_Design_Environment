airframe:
  name: "Tarot X6 TL6X001"
  wheelbase_mm: 960
  num_motors: 6
  max_prop_diameter_in: 18
  frame_mass_g: 2000
  landing_gear_clearance_mm: 395
  arm_tube_od_mm: 25
  motor_mount_patterns_mm: [16, 19, 25]

# Fixed component masses used by the mass budget.
# Parametric components (motors, ESCs, props, battery, payload) are NOT here —
# they live in the relevant notebook inputs or in payload_manifest.yaml.
fixed_components_g:
  frame: 2000
  flight_controller_pixhawk_6x: 70
  companion_orin_nano_carrier: 350
  rtk_holybro_h_rtk_f9p: 100
  rc_receiver_elrs: 15
  wiring_connectors: 200

# Mass contingency applied on top of the bottom-up sum (fraction).
contingency_fraction: 0.08
