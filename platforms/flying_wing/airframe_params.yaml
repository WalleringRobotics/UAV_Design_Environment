# Flying wing — airframe geometry and fixed components.
#
# Datum: x = 0 at the wing ROOT LEADING EDGE, positive aft (mm).
# Baseline planform = the design checked against the rcplanes.online
# flying-wing CG calculator (see tests/test_wing.py).

airframe:
  name: "Wallering flying wing (baseline)"
  configuration: tailless_swept
  propulsion_layout: pusher

wing:
  # Single trapezoid per side. For a cranked wing replace these four keys with
  # a `panels:` list — see uavdesign.aero.Wing.from_dict.
  root_chord_mm: 275
  tip_chord_mm: 107
  half_span_mm: 350
  le_sweep_mm: 217          # LE aft shift root -> tip (31.8 deg)
  ac_chord_fraction: 0.25   # AC / neutral point estimate as fraction of MAC

# Usable fore/aft range for the battery inside the centre pod (mm from root LE).
# The balance notebook checks the solved battery position against this.
battery_bay_x_mm: [20, 160]

# Fixed components with mass and CG position.
# >>> ALL VALUES ARE PLACEHOLDERS — replace with weighed parts. <<<
# Battery and payload are parametric and are NOT listed here.
fixed_components_g:
  wing_structure:      {mass_g: 380, x_mm: 150}   # foam/EPP core + spar + skin
  motor_and_prop:      {mass_g: 60,  x_mm: 290}   # pusher at root TE
  esc:                 {mass_g: 20,  x_mm: 230}
  elevon_servos_x2:    {mass_g: 24,  x_mm: 220}
  flight_controller:   {mass_g: 25,  x_mm: 120}
  gnss:                {mass_g: 15,  x_mm: 140}
  rc_receiver:         {mass_g: 5,   x_mm: 100}
  wiring_connectors:   {mass_g: 40,  x_mm: 150}

contingency_fraction: 0.08
