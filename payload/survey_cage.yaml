# Survey cage — the payload the survey wing is designed around.
#
# Source of truth: Wallering_IMX542_Orin_Architecture.md (rev 2, §7 budgets,
# §11 open items). Masses there are given as ranges; the value used here is
# stated per item. `confirm:` marks numbers still to be checked on the real part.
#
# Mechanical rule (hard constraint, from the Tarot build):
#   camera and GNSS antenna are ONE rigid assembly — the cage — with vibration
#   isolation BENEATH the whole cage, never inside the camera-antenna lever arm.
#
# Cage frame: origin on the lens optical axis at the lens front face,
# x aft, y right, z up (lens looks down along -z). All dims in mm.

cage:
  # Members on the rigid cage (isolated as one unit)
  members:
    camera:
      part: "Basler ace 2 GigE PRO, IMX542 colour (a2A5328-4gcPRO)"
      mass_g: 90
      power_w: 3.5
      envelope_mm: [29, 29, 42]        # confirm: GigE housing length
      position_mm: [0, 0, 75.5]        # bottom face sits on the lens back
      confirm: "Basler lists a2A5328-4gcPRO as 'not in series production yet' (Oct 2026); 4 fps max"
    lens:
      part: "Kowa LM25FC24M 25 mm f/1.8 1.1in C-mount"
      mass_g: 220                      # datasheet: <= 220 g
      envelope_mm: [45, 45, 75.5]      # datasheet: 45 x 75.5 mm (55 mm over knurled screws)
      position_mm: [0, 0, 0]
    gnss_receiver:
      part: "ArduSimple simpleRTK2B (u-blox ZED-F9P)"
      mass_g: 30
      power_w: 0.6
      envelope_mm: [68, 53, 15]
      position_mm: [0, 0, 135]
    gnss_antenna:
      part: "Helical L1/L2 antenna + cable"
      mass_g: 50
      envelope_mm: [28, 28, 60]        # confirm: specific helical model
      position_mm: [0, 0, 150]         # on the mast, clears the hatch
    timing_isolation:
      part: "Opto-isolation, trigger + ExposureActive (ACPL-M61L / TLP2361)"
      mass_g: 20
      envelope_mm: [30, 20, 10]
      position_mm: [0, 25, 120]
  # Printed cage structure + dampers; replaced by the CAD mass when generated
  structure_mass_g: 110
  damper_count: 4
  # Clearance kept between the lens front and the belly window plane
  window_standoff_mm: 6

# Items that ride on the airframe (not the cage) but belong to the payload
tray:
  harness:
    part: "Cat6a S/FTP 0.3 m, shielded trigger pair, 12 V leads"
    mass_g: 90
  nvme:
    part: "NVMe 1 TB 2242/2230"
    mass_g: 10
    power_w: 4.0

# The two payload configurations the airframe must carry (one airframe, sized
# for the heavier; see platforms/survey_wing/design_point.yaml).
compute:
  orin:
    label: "Heavy — Orin Nano Super, live mosaic onboard"
    part: "Orin Nano Super + Connect Tech Hadron-DM (NGX024) + heatsink/fan"
    mass_g: 300                        # doc: 270-320 g incl. heatsink
    power_w: 20.0                      # doc: 15-25 W
    envelope_mm: [100, 62, 40]
    confirm: "Heatsink mass and thermal path (doc §11.6) still open"
  cm5:
    label: "Light — Raspberry Pi CM5 ingest-write-log, no live mosaic"
    part: "Raspberry Pi CM5 + compact GbE/NVMe carrier + heatsink"
    mass_g: 70                         # doc §11.10: ~50 g + heatsink
    power_w: 6.0
    envelope_mm: [75, 55, 25]
    confirm: "Carrier choice (needs GbE + NVMe + 2x UART + PPS GPIO)"
